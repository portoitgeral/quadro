<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro de Projetos · Porto iT</title>
<link rel="icon" type="image/svg+xml" href="icon-semana.svg">
<link rel="icon" type="image/png" href="icon-semana.png">
<link rel="apple-touch-icon" href="icon-semana.png">
<meta name="theme-color" content="#004388">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho fixo com abas; quadro = colunas por dia com rolagem lateral; atualizações = resumo por projeto + histórico */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --col:#E8EDF3; --ink:#1B1B1B; --muted:#706F6F; --line:#D5DBE3;
  --accent:#1D71B8; --accent-ink:#FFFFFF; --accent-soft:#E2EEF9;
  --rose:#004388; --rose-soft:#E1EAF5; --header:#004388;
  --hi:#C8423B; --md:#C98E1E; --lo:#2E8A5E; --done:#B2B2B2;
  --font-display:"Saira","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1520; --surface:#16202E; --col:#121B27; --ink:#EEF2F7; --muted:#A9B3C1; --line:#26344A;
    --accent:#5AA6E8; --accent-ink:#0A1420; --accent-soft:#1A3350;
    --rose:#8FC0F0; --rose-soft:#1B2E47; --header:#0A2E5C;
    --hi:#F0716A; --md:#E6B246; --lo:#5CC08E; --done:#6F7A8A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#16202E; --col:#121B27; --ink:#EEF2F7; --muted:#A9B3C1; --line:#26344A;
  --accent:#5AA6E8; --accent-ink:#0A1420; --accent-soft:#1A3350;
  --rose:#8FC0F0; --rose-soft:#1B2E47; --header:#0A2E5C;
  --hi:#F0716A; --md:#E6B246; --lo:#5CC08E; --done:#6F7A8A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}

header{position:sticky;top:0;z-index:5;background:var(--header);color:#fff;box-shadow:0 2px 10px rgba(0,30,70,.18)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:30px;width:auto;display:block}
.brand .sep{width:1px;height:22px;background:rgba(255,255,255,.35)}
.brand .area{font-family:var(--font-display);font-weight:500;font-size:15px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;gap:16px;padding:12px 16px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;color:rgba(255,255,255,.75);font-weight:600;font-family:var(--font-display);letter-spacing:.02em}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 -3px 0 #fff}
.icon-btn{border:1px solid rgba(255,255,255,.4);background:transparent;border-radius:8px;padding:7px 10px;color:#fff;font-weight:600}
.icon-btn:hover{background:rgba(255,255,255,.12)}
header :focus-visible{outline-color:#fff}
.banner{padding:8px 16px;font-size:13px;background:var(--accent-soft);color:var(--ink);display:none}
.banner.show{display:block}

main{padding:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav h2{font-size:18px;min-width:170px;text-align:center;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--hi);border-color:var(--hi)}
.btn.small{padding:4px 9px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.segb{border:0;background:transparent;padding:7px 12px;font-weight:500;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#me.need{border-color:var(--rose);color:var(--rose)}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{width:100%;min-height:70px;resize:vertical}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;align-items:flex-start}
.column{flex:0 0 272px;background:var(--col);border-radius:12px;display:flex;flex-direction:column;scroll-snap-align:start;border:1px solid transparent}
.column.today{border-color:var(--accent)}
.column.over{outline:2px dashed var(--accent);outline-offset:-4px}
.col-head{display:flex;align-items:baseline;gap:8px;padding:11px 12px 6px}
.col-head h3{font-size:16px}
.col-head .date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.col-head .count{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface);border-radius:999px;padding:1px 8px}
.column.today .col-head h3{color:var(--accent)}
.col-body{display:flex;flex-direction:column;gap:8px;padding:4px 10px 8px;min-height:40px}
.add{padding:0 10px 10px}
.add input{width:100%;border-style:dashed;background:transparent}
.add input:focus{background:var(--surface);border-style:solid}

.card{background:var(--surface);border-radius:9px;padding:9px 10px 9px 12px;border-left:4px solid var(--line);box-shadow:0 1px 2px rgba(15,25,45,.08);cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.card[data-p="alta"]{border-left-color:var(--hi)}
.card[data-p="media"]{border-left-color:var(--md)}
.card[data-p="baixa"]{border-left-color:var(--lo)}
.card.dragging{opacity:.4}
.card .chk{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.card .body{flex:1;min-width:0}
.card .t{font-weight:500;overflow-wrap:anywhere}
.card.done .t{text-decoration:line-through;color:var(--done)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font-size:11.5px;border-radius:5px;padding:1px 6px;background:var(--col);color:var(--muted);font-variant-numeric:tabular-nums}
.tag.proj{background:var(--rose-soft);color:var(--rose)}
:root{--p0:#7656A8;--p1:#B8622A;--p2:#2E8A5E;--p3:#A2477A;--p4:#1F8585;--p5:#977612}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--p0:#B79BEA;--p1:#F0A26B;--p2:#7FD0A6;--p3:#E691C0;--p4:#6ED0CF;--p5:#E2C35E}}
:root[data-theme="dark"]{--p0:#B79BEA;--p1:#F0A26B;--p2:#7FD0A6;--p3:#E691C0;--p4:#6ED0CF;--p5:#E2C35E}
.tag.who{font-weight:600;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.tag.late{background:transparent;color:var(--hi);border:1px solid var(--hi)}
.empty{font-size:13px;color:var(--muted);padding:6px 2px}

/* Atualizações */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:24px}
.pcard{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--rose);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pcard h3{font-size:17px}
.pcard .line{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.pill.ok{background:color-mix(in srgb,var(--lo) 18%,transparent);color:var(--lo)}
.pill.warn{background:color-mix(in srgb,var(--md) 22%,transparent);color:var(--md)}
.pill.bad{background:color-mix(in srgb,var(--hi) 18%,transparent);color:var(--hi)}
.pill.done{background:var(--col);color:var(--muted)}
.pill.none{background:var(--col);color:var(--muted)}
.stale{font-size:12px;color:var(--hi)}
.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.section-head h2{font-size:19px}
.section-head .spacer{flex:1}
.hist{display:flex;flex-direction:column;gap:10px;max-width:860px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.entry .eh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry .eh .d{font-weight:600;font-variant-numeric:tabular-nums}
.entry .eh .p{color:var(--rose);font-weight:500}
.entry .eh .a{color:var(--muted);font-size:13px;margin-left:auto}
.entry dl{margin:8px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:14px}
.entry dt{color:var(--muted)}
.entry dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

.remind{display:flex;width:100%;text-align:left;gap:8px;align-items:center;background:color-mix(in srgb,var(--md) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--md) 45%,transparent);color:var(--ink);border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:14px}
.remind[hidden]{display:none}
button.remind{cursor:pointer}
.remind b{font-weight:700}
.phase{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);letter-spacing:.02em}
.pmeta{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--col);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.prog b{min-width:38px}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--lo)}.delta.down{color:var(--hi)}
.gl{font-size:13px;font-variant-numeric:tabular-nums}
.gl.late{color:var(--hi);font-weight:700}
.replan{font-size:12px;color:var(--md);font-weight:600}
.rk{font-size:13px;color:var(--hi);font-weight:600}
.pbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.risks{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.risk{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--hi);border-radius:0;padding:7px 9px;background:var(--surface)}
.risk.ok{border-left-color:var(--lo);opacity:.7}
.risk .rt{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.risk .rm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.risk .rm .late{color:var(--hi);font-weight:700}
.risk.ok .rt{text-decoration:line-through}
.riskadd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px}
.riskadd input{min-width:0;width:100%}
.riskadd input:first-child{grid-column:1/-1}
.range{display:flex;gap:10px;align-items:center}
.range input[type=range]{flex:1;accent-color:var(--accent)}
.range input[type=number]{width:74px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.sub{font-family:var(--font-display);font-size:15px;margin:14px 0 8px}
textarea.summary{min-height:300px;font-family:var(--font-body);font-size:13.5px}
.replist{font-size:13px;color:var(--muted);margin:0 0 10px;padding-left:18px}
.chipsx{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chipx{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600}
.chipx button{border:0;background:transparent;color:inherit;font-size:15px;line-height:1;padding:0 6px;border-radius:99px}
.chipx button:hover{background:rgba(0,0,0,.08)}
.bell-wrap{position:relative}
.icon-btn.bell{display:flex;align-items:center;justify-content:center;padding:6px 9px;position:relative}
.badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:99px;background:#E5484D;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--header)}
.bell-panel{position:absolute;right:0;top:calc(100% + 10px);width:min(370px,calc(100vw - 24px));max-height:70vh;overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,20,50,.25);z-index:15}
.bp-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.bp-head h3{font-size:16px;flex:1}
.bp-sec{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.nt{display:flex;gap:10px;padding:10px 14px;border:0;background:transparent;width:100%;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}
.nt:hover{background:var(--col)}
.nt .dotn{width:8px;height:8px;border-radius:50%;background:transparent;margin-top:6px;flex:none}
.nt.unread{background:var(--accent-soft)}
.nt.unread .dotn{background:var(--accent)}
.nt .nx{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.nt .nw{font-size:12px;color:var(--muted);margin-top:2px}
.nt.alert .dotn{background:var(--hi)}
.bp-empty{padding:18px 14px;color:var(--muted);font-size:14px}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 12px;z-index:20;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h2{font-size:20px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.actions .left{margin-right:auto}
.hint{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.list .it{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.list .it span{flex:1}
.list .it.arch span{color:var(--muted);text-decoration:line-through}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.err{color:var(--hi);font-size:13px;min-height:1em}

.login{position:fixed;inset:0;background:var(--header);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px;overflow-y:auto}
.login.show{display:flex}
.login::before{content:"";position:absolute;right:-18vmax;bottom:-18vmax;width:60vmax;height:60vmax;border-radius:50%;border:5vmax solid rgba(255,255,255,.06);pointer-events:none}
.login-logo{height:56px;width:auto;position:relative}
.login-box{position:relative;background:var(--surface);border-radius:16px;padding:30px 26px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 20px 50px rgba(0,20,50,.35)}
.login-box h2{color:var(--rose);font-size:24px}
.login-box p{margin:0;color:var(--muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 14px;font-size:15px}
.gbtn svg{width:18px;height:18px;background:#fff;border-radius:50%;padding:2px;box-sizing:content-box}
.login-box .err:empty{display:none}
.login-foot{position:relative;color:rgba(255,255,255,.7);font-size:13px;margin:0}
@media (max-width:520px){
  .brand img{height:26px}
  .brand .sep,.brand .area{display:none}
  .tabs{margin-left:0;width:100%;order:3}
  .brand{margin-right:auto}
  .tab{flex:1}
  .weeknav h2{min-width:0;font-size:16px}
  .column{flex-basis:84vw}
  .two{grid-template-columns:1fr}
  .riskadd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .riskadd button{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><img src="logo.png" alt="Porto iT" width="132" height="30"><span class="sep"></span><span class="area">Projetos</span><h1 class="sr">Quadro de Projetos</h1></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-quadro" aria-selected="true">Quadro</button>
      <button class="tab" role="tab" id="tab-atualizacoes" aria-selected="false">Atualizações semanais</button>
    </div>
    <div class="bell-wrap"><button class="icon-btn bell" id="btn-bell" aria-label="Notificações" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg><span class="badge" id="bell-badge" hidden>0</span></button><div class="bell-panel" id="bell-panel" hidden></div></div>
    <button class="icon-btn" id="btn-settings" title="Equipe e projetos">Equipe e projetos</button>
    <button class="icon-btn" id="btn-logout" title="Sair da conta" hidden>Sair</button>
  </div>
  <div class="banner" id="banner"></div>
</header>

<main>
  <section id="view-quadro">
    <button class="remind" id="remind-board" hidden></button>
    <div class="toolbar">
      <div class="weeknav">
        <button class="btn small" id="prev" aria-label="Semana anterior">‹</button>
        <h2 id="weeklabel">Semana</h2>
        <button class="btn small" id="next" aria-label="Próxima semana">›</button>
        <button class="btn small" id="thisweek">Esta semana</button>
      </div>
      <div class="chips" id="daychips"><span class="lbl">Mostrar:</span></div>
      <div class="filters">
        <div class="seg" role="group" aria-label="Visão do quadro">
          <button class="segb" id="v-mine" aria-pressed="true">Minhas tarefas</button>
          <button class="segb" id="v-team" aria-pressed="false">Equipe toda</button>
        </div>
        <select id="me" aria-label="Eu sou"></select>
        <select id="f-person" aria-label="Filtrar por pessoa"></select>
        <select id="f-project" aria-label="Filtrar por projeto"></select>
      </div>
    </div>
    <div class="board" id="board"></div>
  </section>

  <section id="view-atualizacoes" hidden>
    <div class="remind" id="remind" hidden></div>
    <div class="section-head">
      <h2>Situação dos projetos</h2>
      <span class="spacer"></span>
      <button class="btn" id="btn-summary">Copiar resumo da semana</button>
      <button class="btn primary" id="new-update">+ Nova atualização</button>
    </div>
    <div class="grid" id="pgrid"></div>
    <div class="section-head">
      <h2>Histórico de atualizações</h2>
      <span class="spacer"></span>
      <select id="h-project" aria-label="Filtrar histórico por projeto"></select>
    </div>
    <div class="hist" id="hist"></div>
  </section>
</main>

<div class="login" id="login">
  <img class="login-logo" src="logo.png" alt="Porto iT" width="246" height="56">
  <div class="login-box">
    <h2>Quadro de Projetos</h2>
    <p id="login-msg">Entre com sua conta Google para ver e organizar as tarefas da equipe.</p>
    <button class="btn primary gbtn" id="login-btn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Entrar com Google</button>

<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,getDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Configuração do Firebase (não é senha; o acesso é protegido pelas regras do Firestore) */
const firebaseConfig = {
  apiKey: "AIzaSyBmkymF52JgHiedU-s7s5Y5jdSvAB5i8Wg",
  authDomain: "quadro-pmo.firebaseapp.com",
  projectId: "quadro-pmo",
  storageBucket: "quadro-pmo.firebasestorage.app",
  messagingSenderId: "1067442098534",
  appId: "1:1067442098534:web:ab42a2676252459115f8a7"
};

(function(){
"use strict";
const DAYS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const DAYS_FULL=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const STATUS={ok:"No prazo",warn:"Atenção",bad:"Atrasado",done:"Concluído"};
const PRIO={alta:"Alta",media:"Média",baixa:"Baixa"};
const PHASES=["Planejamento","Execução","Homologação","Go-live"];

const S={tasks:[],projects:[],updates:[],risks:[],notifs:[],team:[],week:monday(new Date()),days:[0,1,2,3,4],backlog:true,
  fPerson:"",fProject:"",hProject:"",me:"",mine:true,tab:"quadro",canWrite:true,db:null,uid:null,loaded:false};

/* ---------- utilidades ---------- */
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function br(s){if(!s)return "";const d=parse(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()}
function brShort(s){const d=parse(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)}
function today(){return iso(new Date())}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function $(id){return document.getElementById(id)}
function pColor(name){const i=S.team.indexOf(name);return i<0?"":"var(--p"+(i%6)+")"}
function projName(id){const p=S.projects.find(p=>p.id===id);return p?p.name:""}
const MONTHS=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

/* ---------- avisos ---------- */
let bannerTimer=null;
function banner(msg,sticky){const b=$("banner");b.textContent=msg;b.classList.toggle("show",!!msg);clearTimeout(bannerTimer);if(msg&&!sticky)bannerTimer=setTimeout(()=>b.classList.remove("show"),6000)}

/* ---------- gravação ---------- */
async function write(fn){
  if(!S.db){banner("Entre com sua conta Google para salvar.",true);return false}
  if(!S.canWrite){banner("Seu e-mail não tem acesso para editar. Peça para a Jú incluir você.",true);return false}
  try{await fn();return true}
  catch(e){
    const c=e&&e.code;
    if(c==="unavailable"){try{await new Promise(r=>setTimeout(r,400+Math.random()*600));await fn();return true}catch(e2){}}
    if(c==="permission-denied"){S.canWrite=false;banner("Não deu para salvar: seu e-mail não tem acesso. Peça para a Jú incluir você.",true);renderAll()}
    else if(c==="resource-exhausted"){banner("O limite diário gratuito do quadro acabou. Volta a funcionar amanhã; avise a Jú.",true)}
    else banner("Não consegui salvar agora. Tente de novo em alguns segundos.");
    return false;
  }
}
function col(name){return S.db.collection(name)}

/* ---------- preferências (dias visíveis) ---------- */
let prefTimer=null;
function loadLocalPrefs(){try{const p=JSON.parse(localStorage.getItem("quadro.prefs")||"null");if(p){applyPrefs(p)}}catch(e){}}
function applyPrefs(p){if(Array.isArray(p.days))S.days=p.days.filter(n=>n>=0&&n<=6);if(typeof p.backlog==="boolean")S.backlog=p.backlog;if(typeof p.me==="string")S.me=p.me;if(typeof p.mine==="boolean")S.mine=p.mine}
function savePrefs(){
  const p={days:S.days,backlog:S.backlog,me:S.me,mine:S.mine};
  try{localStorage.setItem("quadro.prefs",JSON.stringify(p))}catch(e){}
  clearTimeout(prefTimer);
  prefTimer=setTimeout(async()=>{if(S.db&&S.uid){try{await S.db.doc("prefs/"+S.uid).set(p)}catch(e){}}},800);
}

/* ---------- render: quadro ---------- */
function renderDayChips(){
  const box=$("daychips");
  let h='<span class="lbl">Mostrar:</span>';
  h+='<button class="chip" data-chip="backlog" aria-pressed="'+S.backlog+'">Sem dia</button>';
  DAYS.forEach((d,i)=>{h+='<button class="chip" data-chip="'+i+'" aria-pressed="'+S.days.includes(i)+'">'+d+'</button>'});
  box.innerHTML=h;
}
function renderFilters(){
  const people=[...new Set([...S.team,...S.tasks.map(t=>t.owner).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  $("f-person").innerHTML='<option value="">Todas as pessoas</option>'+people.map(p=>'<option'+(p===S.fPerson?' selected':'')+'>'+esc(p)+'</option>').join("");
  const meOpts=[...new Set([...S.team,S.me].filter(Boolean))];
  $("me").innerHTML='<option value="">'+(S.me?'Eu sou…':'Quem é você?')+'</option>'+meOpts.map(p=>'<option'+(p===S.me?' selected':'')+'>Eu sou '+esc(p)+'</option>').join("");
  [...$("me").options].forEach((o,i)=>{if(i>0)o.value=meOpts[i-1]});
  $("me").value=S.me;
  $("me").classList.toggle("need",!S.me);
  $("v-mine").setAttribute("aria-pressed",S.mine);
  $("v-team").setAttribute("aria-pressed",!S.mine);
  $("f-person").hidden=S.mine&&!!S.me;
  const projs=S.projects.filter(p=>!p.archived);
  $("f-project").innerHTML='<option value="">Todos os projetos</option>'+projs.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===S.fProject?' selected':'')+'>'+esc(p.name)+'</option>').join("");
}
function visible(t){
  if(S.mine&&S.me){if(t.owner!==S.me)return false}
  else if(S.fPerson&&t.owner!==S.fPerson)return false;
  if(S.fProject&&t.project!==S.fProject)return false;
  return true;
}
function sortTasks(a,b){return (a.order||0)-(b.order||0)}
function cardHTML(t){
  const td=today();
  let meta="";
  if(t.project&&projName(t.project))meta+='<span class="tag proj">'+esc(projName(t.project))+'</span>';
  if(t.owner){const c=pColor(t.owner);meta+='<span class="tag'+(c?' who" style="--pc:'+c:'')+'">'+esc(t.owner)+'</span>'}
  if(t.due)meta+='<span class="tag'+(!t.done&&t.due<td?' late':'')+'">Prazo '+brShort(t.due)+'</span>';
  if(!t.done&&t.day&&t.day<td&&!(t.due&&t.due<td))meta+='<span class="tag late">Pendente</span>';
  return '<div class="card'+(t.done?' done':'')+'" data-id="'+esc(t.id)+'" data-p="'+esc(t.priority||"")+'" draggable="'+S.canWrite+'" tabindex="0">'+
    '<input type="checkbox" class="chk" aria-label="Marcar como concluída"'+(t.done?' checked':'')+(S.canWrite?'':' disabled')+'>'+
    '<div class="body"><div class="t">'+esc(t.title)+'</div>'+(meta?'<div class="meta">'+meta+'</div>':'')+'</div></div>';
}
function columnHTML(key,title,sub,isToday,list){
  const n=list.length;
  return '<div class="column'+(isToday?' today':'')+'" data-day="'+key+'">'+
    '<div class="col-head"><h3>'+title+'</h3>'+(sub?'<span class="date">'+sub+'</span>':'')+'<span class="count">'+n+'</span></div>'+
    '<div class="col-body">'+(n?list.map(cardHTML).join(""):'<div class="empty">'+(S.loaded?'Nada por aqui.':'Carregando…')+'</div>')+'</div>'+
    (S.canWrite?'<div class="add"><input type="text" placeholder="+ Adicionar tarefa" aria-label="Adicionar tarefa em '+esc(title)+'" data-add="'+key+'"></div>':'')+
  '</div>';
}
function renderBoard(){
  const w=S.week, end=addDays(w,6);
  $("weeklabel").textContent=pad(w.getDate())+(w.getMonth()!==end.getMonth()?" "+MONTHS[w.getMonth()]:"")+" a "+pad(end.getDate())+" "+MONTHS[end.getMonth()]+" "+end.getFullYear();
  const td=today();
  let h="";
  if(S.backlog){
    const list=S.tasks.filter(t=>!t.day&&visible(t)).sort(sortTasks);
    h+=columnHTML("","Sem dia","",false,list);
  }
  [...S.days].sort((a,b)=>a-b).forEach(i=>{
    const d=iso(addDays(w,i));
    const list=S.tasks.filter(t=>t.day===d&&visible(t)).sort(sortTasks);
    h+=columnHTML(d,DAYS[i],brShort(d),d===td,list);
  });
  if(!h)h='<div class="empty">Escolha pelo menos um dia em “Mostrar”.</div>';
  $("board").innerHTML=h;
}

/* ---------- render: atualizações ---------- */
function updatesOf(pid){return S.updates.filter(u=>u.projectId===pid).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0))}
function latestUpdate(pid){return updatesOf(pid)[0]}
function isNum(x){return typeof x==="number"&&isFinite(x)}
function progressInfo(pid){
  const us=updatesOf(pid).filter(u=>isNum(u.progress));
  if(!us.length)return null;
  return {value:us[0].progress,delta:us.length>1?us[0].progress-us[1].progress:null};
}
function openRisks(pid){return S.risks.filter(r=>r.projectId===pid&&r.status!=="resolvido")}
function goLiveHTML(p,u){
  if(!p.goLive)return "";
  const td=today(),d=daysBetween(td,p.goLive);
  let h;
  if(u&&u.status==="done")h='<div class="gl">Go-live: '+br(p.goLive)+'</div>';
  else if(d>0)h='<div class="gl">Go-live em <b>'+d+' dia'+(d===1?'':'s')+'</b> · '+br(p.goLive)+'</div>';
  else if(d===0)h='<div class="gl"><b>Go-live hoje</b></div>';
  else h='<div class="gl late">Go-live previsto passou há '+(-d)+' dia'+(d===-1?'':'s')+' ('+br(p.goLive)+')</div>';
  const n=Array.isArray(p.replans)?p.replans.length:0;
  if(n&&p.goLiveBase){const shift=daysBetween(p.goLiveBase,p.goLive);h+='<div class="replan">Replanejado '+n+'× ('+(shift>=0?'+':'')+shift+' dias desde o plano original)</div>'}
  return h;
}
function pendingThisWeek(){
  const mon=iso(monday(new Date()));
  return S.projects.filter(p=>!p.archived).filter(p=>{const u=latestUpdate(p.id);if(u&&u.status==="done")return false;return !u||u.date<mon});
}
function renderReminder(){
  const pend=S.loaded?pendingThisWeek():[];
  const names=pend.map(p=>p.name);
  const txt=pend.length?'<b>Lembrete:</b> falta'+(pend.length>1?'m':'')+' atualizar '+pend.length+' projeto'+(pend.length>1?'s':'')+' esta semana: '+esc(names.slice(0,4).join(", "))+(names.length>4?' e mais '+(names.length-4):'')+'.':'';
  const r=$("remind");r.hidden=!pend.length;r.innerHTML=txt;
  const wd=new Date().getDay();
  const rb=$("remind-board");rb.hidden=!(pend.length&&(wd===4||wd===5||wd===6||wd===0));rb.innerHTML=txt+' <span style="margin-left:auto;color:var(--accent);font-weight:700">Atualizar agora ›</span>';
}
function renderProjects(){
  const projs=S.projects.filter(p=>!p.archived).sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
  const td=today();
  if(!projs.length){$("pgrid").innerHTML='<div class="empty">Nenhum projeto cadastrado ainda. Cadastre em “Equipe e projetos” ou direto na primeira atualização.</div>';return}
  $("pgrid").innerHTML=projs.map(p=>{
    const u=latestUpdate(p.id);
    const open=S.tasks.filter(t=>t.project===p.id&&!t.done).length;
    const age=u?daysBetween(u.date,td):null;
    const stale=!u||age>7;
    const pr=progressInfo(p.id);
    const rk=openRisks(p.id);const rkLate=rk.filter(r=>r.due&&r.due<td).length;
    const meta=[p.client,p.manager?'GP: '+p.manager:''].filter(Boolean).map(esc).join(' · ');
    return '<div class="pcard"><div class="row"><h3>'+esc(p.name)+'</h3></div>'+
      (meta?'<div class="pmeta">'+meta+'</div>':'')+
      (Array.isArray(p.team)&&p.team.length?'<div class="pmeta">Equipe: '+esc(p.team.slice(0,3).join(", "))+(p.team.length>3?' +'+(p.team.length-3):'')+'</div>':'')+
      '<div class="row">'+(u?'<span class="pill '+esc(u.status||"none")+'">'+esc(STATUS[u.status]||"Sem status")+'</span>':'<span class="pill none">Sem atualização</span>')+
        (u&&u.phase?'<span class="phase">'+esc(u.phase)+'</span>':'')+'</div>'+
      (pr?'<div class="prog"><b>'+pr.value+'%</b><div class="bar"><i style="width:'+Math.max(0,Math.min(100,pr.value))+'%"></i></div>'+(pr.delta?'<span class="delta '+(pr.delta>0?'up':'down')+'">'+(pr.delta>0?'+':'')+pr.delta+'%</span>':'')+'</div>':'')+
      goLiveHTML(p,u)+
      (rk.length?'<div class="rk">'+rk.length+' risco'+(rk.length>1?'s':'')+' aberto'+(rk.length>1?'s':'')+(rkLate?' · '+rkLate+' com prazo vencido':'')+'</div>':'')+
      '<div class="line">'+(u?'Última atualização: '+br(u.date)+(u.author?' · '+esc(u.author):''):'Ainda não teve atualização')+'</div>'+
      (stale&&!(u&&u.status==="done")?'<div class="stale">'+(u?'Sem atualização há '+age+' dias':'Precisa da primeira atualização')+'</div>':'')+
      '<div class="line">'+open+' tarefa'+(open===1?'':'s')+' em aberto no quadro</div>'+
      '<div class="pbtns">'+(S.canWrite?'<button class="btn small primary" data-upd="'+esc(p.id)+'">Atualizar</button>':'')+
        '<button class="btn small" data-proj="'+esc(p.id)+'">Dados do projeto</button>'+
        '<button class="btn small" data-risk="'+esc(p.id)+'">Riscos</button></div>'+
    '</div>';
  }).join("");
}
function renderHistory(){
  const all=S.projects.slice().sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
  $("h-project").innerHTML='<option value="">Todos os projetos</option>'+all.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===S.hProject?' selected':'')+'>'+esc(p.name)+'</option>').join("");
  const list=S.updates.filter(u=>!S.hProject||u.projectId===S.hProject).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
  if(!list.length){$("hist").innerHTML='<div class="empty">'+(S.loaded?'Nenhuma atualização registrada.':'Carregando…')+'</div>';return}
  $("hist").innerHTML=list.map(u=>{
    let dl="";
    if(u.phase||isNum(u.progress))dl+='<dt>Fase</dt><dd>'+esc(u.phase||"—")+(isNum(u.progress)?' · '+u.progress+'% concluído':'')+'</dd>';
    if(u.done)dl+='<dt>Feito</dt><dd>'+esc(u.done)+'</dd>';
    if(u.next)dl+='<dt>Próximos passos</dt><dd>'+esc(u.next)+'</dd>';
    if(u.risks)dl+='<dt>Riscos</dt><dd>'+esc(u.risks)+'</dd>';
    return '<div class="entry" data-uid="'+esc(u.id)+'" tabindex="0"><div class="eh"><span class="d">'+br(u.date)+'</span><span class="p">'+esc(projName(u.projectId)||"Projeto removido")+'</span>'+
      (u.status?'<span class="pill '+esc(u.status)+'">'+esc(STATUS[u.status])+'</span>':'')+
      (u.author?'<span class="a">'+esc(u.author)+'</span>':'')+'</div>'+(dl?'<dl>'+dl+'</dl>':'')+'</div>';
  }).join("");
}
/* ---------- notificações ---------- */
function notify(to,text,ref){
  to=(to||"").trim();
  if(!S.db||!to||to===S.me)return;
  try{col("notifs").add({to,text,ref:ref||{},by:S.me||"",at:Date.now(),read:false}).catch(()=>{})}catch(e){}
}
function ago(ms){const m=Math.round((Date.now()-ms)/60000);if(m<1)return "agora";if(m<60)return "há "+m+" min";const h=Math.round(m/60);if(h<24)return "há "+h+"h";const d=Math.round(h/24);return d===1?"ontem":"há "+d+" dias"}
function myAlerts(){
  if(!S.me||!S.loaded)return [];
  const td=today(),tm=iso(addDays(new Date(),1)),out=[];
  S.tasks.filter(t=>t.owner===S.me&&!t.done).forEach(t=>{
    if(t.due&&t.due<td)out.push({key:"tl:"+t.id+":"+t.due,text:"Tarefa com prazo vencido: "+t.title+" ("+br(t.due)+")",ref:{type:"task",id:t.id}});
    else if(t.due&&t.due<=tm)out.push({key:"td:"+t.id+":"+t.due,text:"Prazo "+(t.due===td?"hoje":"amanhã")+": "+t.title,ref:{type:"task",id:t.id}});
  });
  S.risks.filter(r=>r.owner===S.me&&r.status!=="resolvido"&&r.due&&r.due<=tm).forEach(r=>{
    out.push({key:"rk:"+r.id+":"+r.due,text:(r.due<td?"Risco com prazo vencido":"Risco vence "+(r.due===td?"hoje":"amanhã"))+" ("+projName(r.projectId)+"): "+r.text,ref:{type:"risk",id:r.projectId}});
  });
  const pend=pendingThisWeek().filter(p=>!p.manager||p.manager===S.me);
  if(pend.length)out.push({key:"wk:"+iso(monday(new Date()))+":"+pend.length,text:"Atualização semanal pendente: "+pend.map(p=>p.name).slice(0,3).join(", ")+(pend.length>3?" e mais "+(pend.length-3):""),ref:{type:"updates"}});
  return out;
}
function seenAlerts(){try{return JSON.parse(localStorage.getItem("quadro.seen")||"[]")}catch(e){return []}}
function setSeen(keys){try{localStorage.setItem("quadro.seen",JSON.stringify(keys.slice(-200)))}catch(e){}}
function myNotifs(){return S.notifs.filter(n=>n.to===S.me).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,40)}
function renderBell(){
  const seen=seenAlerts();
  const n=S.me?myNotifs().filter(x=>!x.read).length+myAlerts().filter(a=>!seen.includes(a.key)).length:0;
  const b=$("bell-badge");b.hidden=!n;b.textContent=n>9?"9+":n;
  if(!$("bell-panel").hidden)drawBellPanel();
}
function drawBellPanel(){
  const pnl=$("bell-panel");
  if(!S.me){pnl.innerHTML='<div class="bp-head"><h3>Notificações</h3></div><div class="bp-empty">Escolha seu nome em “Quem é você?”, na aba Quadro, para receber notificações.</div>';return}
  const al=myAlerts(),ns=myNotifs();
  let h='<div class="bp-head"><h3>Notificações</h3>'+(ns.some(x=>!x.read)?'<button class="btn small" id="bp-readall">Marcar como lidas</button>':'')+'</div>';
  if(al.length)h+='<div class="bp-sec">Atenção</div>'+al.map((a,i)=>'<button class="nt alert" data-al="'+i+'"><span class="dotn"></span><span class="nx">'+esc(a.text)+'</span></button>').join("");
  h+='<div class="bp-sec">Recentes</div>'+(ns.length?ns.map(x=>'<button class="nt'+(x.read?'':' unread')+'" data-nt="'+esc(x.id)+'"><span class="dotn"></span><span class="nx">'+esc(x.text)+'<div class="nw">'+(x.by?esc(x.by)+' · ':'')+ago(x.at||Date.now())+'</div></span></button>').join(""):'<div class="bp-empty">Nada novo por aqui.</div>');
  pnl.innerHTML=h;
  const go=ref=>{closeBell();if(!ref)return;
    if(ref.type==="task"){setTab("quadro");openTask(ref.id)}
    else if(ref.type==="risk"){setTab("atualizacoes");openRiskModal(ref.id)}
    else if(ref.type==="update"||ref.type==="updates"){setTab("atualizacoes")}};
  pnl.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>go(al[+b.dataset.al].ref));

  const target=e.target.closest(".card");
  let order;
  if(target&&target.dataset.id!==id){
    const idx=siblings.findIndex(t=>t.id===target.dataset.id);
    const after=siblings[idx], before=siblings[idx-1];

async function ensureProject(name){
  const ex=S.projects.find(p=>p.name.trim().toLowerCase()===name.trim().toLowerCase());

  let ref=null;
  const ok=await write(async()=>{ref=await col("projects").add({name:name.trim(),archived:false,createdAt:Date.now()})});
  return ok&&ref?ref.id:null;
}

function prefillDone(pid,date){
  const end=date||today(), startD=iso(addDays(parse(end),-6));
  const inRange=t=>{if(t.doneAt){const d=iso(new Date(t.doneAt));return d>=startD&&d<=end}return t.day&&t.day>=startD&&t.day<=end};
  return S.tasks.filter(t=>t.project===pid&&t.done&&inRange(t)).map(t=>"• "+t.title).join("\n");
}
function prefillNext(pid,date){
  const st=date||today(), endD=iso(addDays(parse(st),10));
  return S.tasks.filter(t=>t.project===pid&&!t.done&&(!t.day||(t.day>=st&&t.day<=endD))).sort((a,b)=>(a.day||"9").localeCompare(b.day||"9")).slice(0,8).map(t=>"• "+t.title+(t.day?" ("+brShort(t.day)+")":"")).join("\n");
}

}

  const ro=!S.canWrite?' disabled':'';
  const reps=Array.isArray(p.replans)?p.replans:[];
  openModal('<h2>Dados do projeto</h2><form id="pform">'+
    '<div class="field"><label for="p-name">Nome do projeto</label><input type="text" id="p-name" required value="'+esc(p.name)+'"'+ro+'></div>'+
    '<div class="two"><div class="field"><label for="p-client">Cliente</label><input type="text" id="p-client" value="'+esc(p.client||"")+'"'+ro+'></div>'+
    '<div class="field"><label for="p-manager">Gerente do projeto</label><input type="text" id="p-manager" list="dl-team-p" value="'+esc(p.manager||"")+'"'+ro+'>'+teamList("dl-team-p")+'</div></div>'+
    '<div class="two"><div class="field"><label for="p-start">Início</label><input type="date" id="p-start" value="'+esc(p.start||"")+'"'+ro+'></div>'+
    '<div class="field"><label for="p-golive">Go-live previsto</label><input type="date" id="p-golive" value="'+esc(p.goLive||"")+'"'+ro+'></div></div>'+
    '<div class="field"><label for="p-tm">Equipe do projeto</label><div class="chipsx" id="p-team"></div>'+
      (S.canWrite?'<div class="inline"><input type="text" id="p-tm" placeholder="Nome de quem trabalha no projeto" aria-label="Adicionar pessoa à equipe do projeto"><button type="button" class="btn" id="p-tm-add">Adicionar</button></div>':'')+
      '<span class="hint">Esses nomes aparecem como sugestão no responsável dos riscos deste projeto.</span></div>'+
    '<div class="field" id="p-reason-f" hidden><label for="p-reason">Motivo da mudança do go-live</label><input type="text" id="p-reason" placeholder="Ex.: atraso na homologação do cliente"'+ro+'></div>'+
    (p.goLiveBase?'<p class="hint">Go-live do plano original: '+br(p.goLiveBase)+'</p>':'')+
    (reps.length?'<div class="sub">Replanejamentos</div><ul class="replist">'+reps.map(r=>'<li>'+br(r.at)+': '+br(r.from)+' → '+br(r.to)+(r.reason?' · '+esc(r.reason):'')+'</li>').join("")+'</ul>':'')+
    '<div class="err" id="p-err"></div>'+
    '<div class="actions"><button type="button" class="btn" id="p-cancel">'+(S.canWrite?'Cancelar':'Fechar')+'</button>'+(S.canWrite?'<button type="submit" class="btn primary">Salvar</button>':'')+'</div></form>');
  $("p-cancel").onclick=closeModal;
  let team=Array.isArray(p.team)?p.team.filter(x=>typeof x==="string"&&x):[];
  const drawTeam=()=>{$("p-team").innerHTML=team.length?team.map((n,i)=>'<span class="chipx">'+esc(n)+(S.canWrite?'<button type="button" data-tmrm="'+i+'" aria-label="Remover '+esc(n)+'">×</button>':'')+'</span>').join(""):'<span class="hint">Ninguém cadastrado ainda.</span>';
    $("p-team").querySelectorAll("[data-tmrm]").forEach(b=>b.onclick=()=>{team=team.filter((_,i)=>i!==+b.dataset.tmrm);drawTeam()})};
  drawTeam();
  if(S.canWrite){const addT=()=>{const inp=$("p-tm");inp.value.split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!team.some(t=>t.toLowerCase()===n.toLowerCase()))team.push(n)});inp.value="";drawTeam();inp.focus()};
    $("p-tm-add").onclick=addT;$("p-tm").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addT()}}}
  const gl=$("p-golive");
  gl.oninput=()=>{$("p-reason-f").hidden=!(p.goLive&&gl.value&&gl.value!==p.goLive)};
  if(!S.canWrite)return;
  $("pform").onsubmit=async e=>{
    e.preventDefault();
    const name=$("p-name").value.trim();if(!name){$("p-err").textContent="O nome é obrigatório.";return}
    const pend=$("p-tm")&&$("p-tm").value.trim();if(pend)pend.split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!team.some(t=>t.toLowerCase()===n.toLowerCase()))team.push(n)});
    const data={name,client:$("p-client").value.trim(),manager:$("p-manager").value.trim(),start:$("p-start").value||"",goLive:gl.value||"",team};
    if(data.goLive&&!p.goLiveBase)data.goLiveBase=data.goLive;
    if(p.goLive&&data.goLive&&data.goLive!==p.goLive)data.replans=[...reps,{at:today(),from:p.goLive,to:data.goLive,reason:$("p-reason").value.trim()}];
    if(await write(()=>col("projects").doc(pid).update(data)))closeModal();
  };
}

function openRiskModal(pid){
  openModal('<h2>Riscos · '+esc(projName(pid))+'</h2><div id="m-rk"></div><div class="actions"><button type="button" class="btn" id="rk-close">Fechar</button></div>');
  riskBlock("m-rk",pid);
  $("rk-close").onclick=closeModal;
}

function weekSummary(){
  const mon=monday(new Date()),sun=addDays(mon,6),td=today();
  const lines=["Resumo semanal de projetos · semana de "+brShort(iso(mon))+" a "+br(iso(sun)),""];
  const projs=S.projects.filter(p=>!p.archived).sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
  const counts={};projs.forEach(p=>{const u=latestUpdate(p.id);const k=u&&u.status?STATUS[u.status]:"Sem status";counts[k]=(counts[k]||0)+1});
  lines.push("Visão geral: "+Object.entries(counts).map(([k,n])=>n+" "+k.toLowerCase()).join(" · "));
  projs.forEach(p=>{
    const u=latestUpdate(p.id),pr=progressInfo(p.id),rk=openRisks(p.id);
    lines.push("","━━━━━━━━━━━━━━━━━━━━");
    lines.push(p.name+(p.client?" ("+p.client+")":"")+" · "+(u&&u.status?STATUS[u.status]:"Sem status"));
    const info=[];
    if(u&&u.phase)info.push("Fase: "+u.phase);
    if(pr)info.push("Avanço: "+pr.value+"%"+(pr.delta?" ("+(pr.delta>0?"+":"")+pr.delta+"% na semana)":""));
    if(p.manager)info.push("GP: "+p.manager);
    if(info.length)lines.push(info.join(" · "));
    if(p.goLive){
      const d=daysBetween(td,p.goLive);
      let g="Go-live: "+br(p.goLive)+(u&&u.status==="done"?"":d>0?" (em "+d+" dias)":d===0?" (hoje)":" (passou há "+(-d)+" dias)");
      const n=Array.isArray(p.replans)?p.replans.length:0;
      if(n&&p.goLiveBase){const sh=daysBetween(p.goLiveBase,p.goLive);g+=" · replanejado "+n+"x, "+(sh>=0?"+":"")+sh+" dias vs. plano original"}
      lines.push(g);
    }
    if(!u||u.date<iso(mon))lines.push("Atenção: sem atualização nesta semana"+(u?" (última em "+br(u.date)+")":""));
    if(u&&u.date>=iso(mon)){
      if(u.done){lines.push("","Realizado:");u.done.split("\n").forEach(l=>{l=l.trim();if(l)lines.push(l.startsWith("•")?l:"• "+l)})}
      if(u.next){lines.push("","Próximos passos:");u.next.split("\n").forEach(l=>{l=l.trim();if(l)lines.push(l.startsWith("•")?l:"• "+l)})}
    }
    if(rk.length){lines.push("","Riscos abertos:");rk.forEach(r=>lines.push("• "+r.text+(r.owner?" · resp.: "+r.owner:"")+(r.due?" · prazo "+br(r.due)+(r.due<td?" (vencido)":""):"")))}
  });
  return lines.join("\n");
}
function openSummary(){
  const txt=weekSummary();
  openModal('<h2>Resumo da semana</h2><p class="hint" style="margin:0 0 8px">Texto pronto para colar no e-mail ou no Teams. Dá pra editar aqui antes de copiar.</p>'+
    '<textarea class="summary" id="sum-t" aria-label="Resumo da semana">'+esc(txt)+'</textarea>'+
    '<div class="actions"><span class="hint left" id="sum-ok"></span><button type="button" class="btn" id="sum-close">Fechar</button><button type="button" class="btn primary" id="sum-copy">Copiar</button></div>');
  $("sum-close").onclick=closeModal;
  $("sum-copy").onclick=async()=>{
    const t=$("sum-t");
    try{await navigator.clipboard.writeText(t.value);$("sum-ok").textContent="Copiado!"}
    catch(e){t.focus();t.select();try{document.execCommand("copy");$("sum-ok").textContent="Copiado!"}catch(e2){$("sum-ok").textContent="Selecione o texto e copie com Ctrl+C."}}
  };
}
$("new-update").onclick=()=>openUpdate(null,"");
$("pgrid").addEventListener("click",e=>{
  const b=e.target.closest("[data-upd]");if(b)return openUpdate(null,b.dataset.upd);
  const pj=e.target.closest("[data-proj]");if(pj)return openProject(pj.dataset.proj);
  const rk=e.target.closest("[data-risk]");if(rk)return openRiskModal(rk.dataset.risk);

$("btn-summary").onclick=openSummary;
$("remind-board").onclick=()=>setTab("atualizacoes");
$("hist").addEventListener("click",e=>{const en=e.target.closest(".entry");if(en)openUpdate(en.dataset.uid)});
$("hist").addEventListener("keydown",e=>{const en=e.target.closest(".entry");if(en&&e.key==="Enter")openUpdate(en.dataset.uid)});

function openSettings(){
  const ro=!S.canWrite;
  const draw=()=>{
    const projs=S.projects.slice().sort((a,b)=>(a.archived-b.archived)||a.name.localeCompare(b.name,"pt-BR"));
    modal.innerHTML='<h2>Equipe e projetos</h2>'+
      '<h3 style="font-size:16px;margin-bottom:8px">Equipe</h3><div class="list">'+
      (S.team.length?S.team.map((p,i)=>'<div class="it"><i class="dot" style="--pc:'+pColor(p)+'"></i><span>'+esc(p)+'</span>'+(ro?'':'<button class="btn small" data-rm-team="'+i+'">Remover</button>')+'</div>').join(""):'<div class="empty">Ninguém cadastrado.</div>')+'</div>'+
      (ro?'':'<div class="inline" style="margin-bottom:18px"><input type="text" id="s-team" placeholder="Primeiro nome" aria-label="Nome da pessoa"><button class="btn" id="s-team-add">Adicionar</button></div>')+
      '<h3 style="font-size:16px;margin-bottom:8px">Projetos</h3><div class="list">'+
      (projs.length?projs.map(p=>'<div class="it'+(p.archived?' arch':'')+'"><span>'+esc(p.name)+'</span>'+(ro?'':'<button class="btn small" data-edit="'+esc(p.id)+'">Dados</button><button class="btn small" data-arch="'+esc(p.id)+'">'+(p.archived?'Reativar':'Arquivar')+'</button>')+'</div>').join(""):'<div class="empty">Nenhum projeto.</div>')+'</div>'+
      (ro?'':'<div class="inline"><input type="text" id="s-proj" placeholder="Nome do projeto" aria-label="Nome do projeto"><button class="btn" id="s-proj-add">Adicionar</button></div>')+
      '<p class="hint">Projetos arquivados somem do quadro e do resumo, mas o histórico fica guardado.</p>'+
      '<div class="actions"><button class="btn" id="s-close">Fechar</button></div>';
    $("s-close").onclick=closeModal;
    if(ro)return;
    const addTeam=async()=>{const n=$("s-team").value.trim();if(!n||S.team.includes(n))return;const team=[...S.team,n];if(await write(()=>S.db.doc("config/team").set({members:team}))){S.team=team;draw();$("s-team").focus()}};
    $("s-team-add").onclick=addTeam;$("s-team").onkeydown=e=>{if(e.key==="Enter")addTeam()};
    const addProj=async()=>{const n=$("s-proj").value.trim();if(!n)return;if(await ensureProject(n)){$("s-proj").value="";setTimeout(draw,300)}};
    $("s-proj-add").onclick=addProj;$("s-proj").onkeydown=e=>{if(e.key==="Enter")addProj()};
    modal.querySelectorAll("[data-rm-team]").forEach(b=>b.onclick=async()=>{const team=S.team.filter((_,i)=>i!==+b.dataset.rmTeam);if(await write(()=>S.db.doc("config/team").set({members:team}))){S.team=team;draw()}});
    modal.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openProject(b.dataset.edit));
    modal.querySelectorAll("[data-arch]").forEach(b=>b.onclick=async()=>{const p=S.projects.find(x=>x.id===b.dataset.arch);if(!p)return;if(await write(()=>col("projects").doc(p.id).update({archived:!p.archived}))){p.archived=!p.archived;draw()}});
  };
  overlay.classList.add("show");draw();
}
$("btn-settings").onclick=openSettings;

/* ---------- conexão (Firebase) ---------- */
function wrapDoc(ref){return{id:ref.id,
  get:async()=>{const x=await getDoc(ref);return{exists:x.exists(),data:()=>x.data()}},
  set:d=>setDoc(ref,d),update:d=>updateDoc(ref,d),delete:()=>deleteDoc(ref),
  onSnapshot:(n,e)=>onSnapshot(ref,{includeMetadataChanges:true},x=>n({exists:x.exists(),data:()=>x.data(),metadata:x.metadata}),e)}}
function makeDB(fs){return{
  doc:path=>wrapDoc(doc(fs,path)),
  collection:name=>{const c=collection(fs,name);return{
    add:async d=>wrapDoc(await addDoc(c,d)),
    doc:id=>wrapDoc(doc(c,id)),
    onSnapshot:(n,e)=>onSnapshot(c,{includeMetadataChanges:true},x=>n({docs:x.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:x.metadata}),e)}}}}

const loginEl=$("login");
function showLogin(msg,denied){
  loginEl.classList.add("show");
  $("login-msg").textContent=msg||"Entre com sua conta Google para ver e editar as tarefas da equipe.";
  $("login-btn").hidden=!!denied;$("login-out").hidden=!denied;
}
function startData(db){
  let pending=6;
  const timer=setTimeout(()=>{if(!S.loaded){S.loaded=true;banner("Não consegui carregar os dados ainda. Confira a internet; a página tenta de novo sozinha.",true);renderAll()}},10000);
  const got=()=>{if(!S.loaded){pending--;if(pending<=0){S.loaded=true;clearTimeout(timer);const b=$("banner");if(b.textContent.startsWith("Não consegui carregar"))banner("")}}};
  let deniedShown=false;
  const fail=(e)=>{clearTimeout(timer);S.loaded=true;
    if(e&&e.code==="permission-denied"){if(!deniedShown){deniedShown=true;showLogin("O e-mail "+(S.email||"")+" ainda não tem acesso a este quadro. Peça para a Jú incluir você e depois recarregue a página.",true)}}
    else banner("A conexão com o quadro caiu. Recarregue a página para continuar.",true);
    renderAll()};
  const mapDocs=snap=>snap.docs.map(d=>Object.assign({id:d.id},d.data()));
  const flags={tasks:false,projects:false,updates:false,team:false,risks:false,notifs:false};
  const once=(k,snap)=>{if(!flags[k]&&!snap.metadata.fromCache){flags[k]=true;got()}};
  db.collection("tasks").onSnapshot(s=>{S.tasks=mapDocs(s).filter(t=>t&&typeof t.title==="string");once("tasks",s);renderAll()},fail);
  db.collection("projects").onSnapshot(s=>{S.projects=mapDocs(s).filter(p=>p&&typeof p.name==="string");once("projects",s);renderAll()},fail);
  db.collection("updates").onSnapshot(s=>{S.updates=mapDocs(s);once("updates",s);renderAll()},fail);
  db.collection("notifs").onSnapshot(s=>{S.notifs=mapDocs(s).filter(n=>n&&typeof n.text==="string");once("notifs",s);renderBell()},e=>{once("notifs",{metadata:{fromCache:false}})});
  db.collection("risks").onSnapshot(s=>{S.risks=mapDocs(s).filter(r=>r&&typeof r.text==="string");once("risks",s);renderAll()},fail);
  db.doc("config/team").onSnapshot(s=>{const d=s.exists?s.data():null;S.team=d&&Array.isArray(d.members)?d.members.filter(x=>typeof x==="string"):[];once("team",s);renderAll()},fail);
}
async function init(){
  loadLocalPrefs();
  const h=location.hash.slice(1);setTab(h==="atualizacoes"?"atualizacoes":"quadro");
  renderAll();
  if(!firebaseConfig){S.loaded=true;banner("Quadro ainda não configurado.",true);renderAll();return}
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  const db=makeDB(getFirestore(app));
  const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
  getRedirectResult(auth).catch(()=>{});
  $("login-btn").onclick=async()=>{
    $("login-err").textContent="";
    try{await signInWithPopup(auth,provider)}
    catch(e){
      const c=e&&e.code||"";
      if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-environment"){try{await signInWithRedirect(auth,provider)}catch(e2){$("login-err").textContent="Não consegui abrir o login. Tente em outro navegador."}}
      else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")$("login-err").textContent="Não consegui entrar. Tente de novo.";
    }
  };
  const out=async()=>{try{await signOut(auth)}catch(e){}location.reload()};
  $("login-out").onclick=out;$("btn-logout").onclick=out;
  let started=false;
  onAuthStateChanged(auth,async u=>{
    if(!u){S.db=null;$("btn-logout").hidden=true;showLogin();return}
    if(started)return;started=true;
    loginEl.classList.remove("show");$("btn-logout").hidden=false;
    S.db=db;S.uid=u.uid;S.email=u.email||"";
    try{const p=await db.doc("prefs/"+S.uid).get();if(p.exists){applyPrefs(p.data());try{localStorage.setItem("quadro.prefs",JSON.stringify({days:S.days,backlog:S.backlog,me:S.me,mine:S.mine}))}catch(e){}}}catch(e){}
    renderAll();
    startData(db);
  });
}
init();
})();
